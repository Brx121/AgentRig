[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-harness"
version = "0.4.0"
description = "Tool-neutral engineering constraints and AI prompt assembly"
requires-python = "==3.12.*"
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
